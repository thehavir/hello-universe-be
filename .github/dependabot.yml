version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      all-github-actions:
        patterns: ['*']

  # Every update PR runs the native build, so a library that needs new
  # reflection metadata fails before merge.
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    groups:
      maven-minor-and-patch:
        update-types: [minor, patch]
