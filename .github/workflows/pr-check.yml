name: PR check

on:
  pull_request:

permissions:
  contents: read

# A new push to the pull request cancels its older, unfinished check.
concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    uses: ./.github/workflows/verify.yml
    with:
      base-sha: ${{ github.base_ref == 'main' && github.event.pull_request.base.sha || '' }}

  build-native:
    name: Build native executable
    needs: verify
    if: github.base_ref == 'main'
    uses: ./.github/workflows/build-native-executable.yml
    with:
      version: ${{ needs.verify.outputs.version }}
