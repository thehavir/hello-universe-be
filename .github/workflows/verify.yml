name: Verify

on:
  workflow_call:
    inputs:
      base-sha:
        description: Commit whose pom.xml version this one is compared with. Empty skips the release decision.
        required: false
        type: string
        default: ''
    outputs:
      version:
        description: Project version from pom.xml; empty when the release decision was skipped.
        value: ${{ jobs.verify.outputs.version }}
      should-release:
        description: "'true' when the version is a new stable release; empty when the decision was skipped."
        value: ${{ jobs.verify.outputs.should-release }}
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: Lint, test, and check version
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.release-decision.outputs.version }}
      should-release: ${{ steps.release-decision.outputs.should-release }}
    steps:
      - name: Check out the code with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Lint the GitHub workflows
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          version: 1.7.12
      - name: Set up Java 25
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Run tests, the formatting check, and Kotlin analysis
        env:
          SPRING_PROFILES_ACTIVE: dev
          NASA_API_KEY: ci-placeholder
        run: >-
          sh ./mvnw --batch-mode --no-transfer-progress
          -Dkotlin.compiler.daemon=false -Dscheduler.fetch-apod.cron=- clean verify
      - name: Decide whether this version is a new release
        id: release-decision
        if: inputs.base-sha != ''
        env:
          BASE_SHA: ${{ inputs.base-sha }}
        run: python3 .github/scripts/detect-release.py
      - name: Upload the test reports after a failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7
