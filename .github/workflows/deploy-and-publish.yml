name: Deploy and publish

on:
  workflow_call:
    inputs:
      version:
        description: Stable version to deploy, without the v prefix.
        required: true
        type: string
      artifact-name:
        description: Workflow artifact that holds the smoke-tested release archive.
        required: true
        type: string
      build-id:
        description: Run ID and attempt of the build, joined by a dash.
        required: true
        type: string
    secrets:
      INFRA_READ_TOKEN:
        description: Read-only token for the infra repository.
        required: true
      DEPLOY_SSH_PRIVATE_KEY:
        description: Private key of the deploy user on the VPS.
        required: true
      VPS_SSH_KNOWN_HOSTS:
        description: Verified known_hosts line with the VPS host key.
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    outputs:
      deployed: ${{ steps.run-playbook.outcome == 'success' }}
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check that this release is still needed
        id: release-check
        uses: ./.github/actions/check-release-needed
        with:
          version: ${{ inputs.version }}
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Check out the infra playbooks at the pinned commit
        if: steps.release-check.outputs.needed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: thehavir/hello-universe-infra
          # Update this full SHA in a backend PR to adopt infra changes.
          ref: 350fd35e968f0fa62e9d215d9418cbbf075b3ae3 # infra main, 2026-11-07
          token: ${{ secrets.INFRA_READ_TOKEN }}
          persist-credentials: false
          path: infra
      - name: Download the release archive
        if: steps.release-check.outputs.needed == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact-name }}
          path: downloaded-archive
      - name: Install the pinned Ansible version
        if: steps.release-check.outputs.needed == 'true'
        run: |
          python3 -m venv "$RUNNER_TEMP/ansible-venv"
          "$RUNNER_TEMP/ansible-venv/bin/pip" install --disable-pip-version-check -r infra/ci-requirements.txt
      - name: Unpack the release files
        if: steps.release-check.outputs.needed == 'true'
        run: |
          mkdir release-files
          tar -xzf downloaded-archive/hello-universe-native.tar.gz -C release-files
      - name: Write the SSH files and Ansible inputs
        if: steps.release-check.outputs.needed == 'true'
        uses: ./.github/actions/write-ansible-inputs
        with:
          build-id: ${{ inputs.build-id }}
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_SSH_PORT: ${{ vars.VPS_SSH_PORT || '22' }}
          VPS_DEPLOY_USER: ${{ vars.VPS_DEPLOY_USER || 'deploy' }}
          PUBLIC_API_HOST: ${{ vars.PUBLIC_API_HOST }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
      - name: Deploy with Ansible and check local and public health
        id: run-playbook
        if: steps.release-check.outputs.needed == 'true'
        working-directory: infra
        env:
          ANSIBLE_HOST_KEY_CHECKING: 'True'
        run: |
          "$RUNNER_TEMP/ansible-venv/bin/ansible-playbook" deploy-artifact.yml \
            -i "$RUNNER_TEMP/ansible-inventory.json" -e "@$RUNNER_TEMP/ansible-extra-vars.json"
      - name: Delete the SSH files and Ansible inputs
        if: always()
        run: >-
          rm -f "$RUNNER_TEMP/deploy-ssh-key" "$RUNNER_TEMP/vps-known-hosts"
          "$RUNNER_TEMP/ansible-inventory.json" "$RUNNER_TEMP/ansible-extra-vars.json"

  publish-release:
    name: Publish the GitHub release
    needs: deploy
    if: needs.deploy.outputs.deployed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download the deployed archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact-name }}
      - name: Check that an existing tag points to this commit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ inputs.version }}
        run: |
          # GitHub would silently release an existing tag from another commit, so stop instead.
          refs=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$TAG")
          if jq -e --arg ref "refs/tags/$TAG" 'any(.[]; .ref == $ref)' <<< "$refs" > /dev/null; then
            tagged_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)
            [[ "$tagged_sha" == "$GITHUB_SHA" ]] || { echo "$TAG belongs to another commit." >&2; exit 1; }
          fi
      - name: Create the GitHub release with the deployed archive
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          tag: v${{ inputs.version }}
          commit: ${{ github.sha }}
          artifacts: hello-universe-native.tar.gz
          artifactErrorsFailBuild: true
          generateReleaseNotes: true
          immutableCreate: true
          skipIfReleaseExists: true
          makeLatest: legacy
