spring:
  # H2 Database Configuration
  datasource:
    url: jdbc:h2:mem:testdb
    driverClassName: org.h2.Driver
    username: sa
    password:

  # H2 Console (web UI for database)
  h2:
    console:
      enabled: true
      path: /h2-console

  # JPA/Hibernate Configuration
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: false

  # Serve the generated thumbnails at media.base-url, like nginx does in
  # production. The path is relative to the folder the app is started from.
  mvc:
    static-path-pattern: /media/**
  web:
    resources:
      static-locations: file:.media/

# Public address of the media folder (thumbnails). Production sets its own
# value in /etc/hello-universe/runtime.yaml.
media:
  base-url: http://localhost:8080/media
  # Thumbnails made while running locally; ignored by git
  thumbnail-dir: .media/thumb
