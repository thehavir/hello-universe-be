spring:
  application:
    name: hellouniverse

  # Database from env vars. The dev profile overrides this with H2.
  # Without a profile, startup fails unless these are set, so production
  # never falls back to an in-memory database.
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

# Actuator: only /actuator/health is exposed, without details.
# It includes a DB check, so it reports DOWN when the database is unreachable.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# NASA API configuration
nasa:
  api:
    base-url: https://api.nasa.gov
    api-key: ${NASA_API_KEY}

# Scheduler configuration
scheduler:
  fetch-apod:
    # every hour
    cron: "0 0 * * * *"

